    function setup() {

    function windowResized() {
      let scaleX = windowWidth / 1280;
      let scaleY = windowHeight / 720;
      currentScale = Math.min(scaleX, scaleY);
      document.getElementById("canvas-wrap").style.transform = `scale(${currentScale})`;
    }

    function getLogicalCoords(clientX, clientY) {
      let rect = document.getElementById("canvas-wrap").getBoundingClientRect();
      return { x: (clientX - rect.left) / currentScale, y: (clientY - rect.top) / currentScale };
    }

    function updateClockUI() {
      let h = Math.floor(currentMinutes / 60), m = currentMinutes % 60;
      clockEl.textContent = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
      weatherEl.textContent = currentWeather;
    }
    function updateTaskUI() {
      taskCounterEl.textContent = `✅ 已完成任务: ${shared.tasksCompleted}`;
      if (shared.papers > 0) {

        itemCounterEl.textContent = `📜 神秘纸条: ${shared.papers}`;
      } else {
        itemCounterEl.style.display = "none"; 
      }

      if (shared.tasksCompleted >= 4 && !shared.hasEnded) {
        shared.hasEnded = true;
        setTimeout(triggerEnding, 500); 
      }
    }
    function advanceTime() {
      currentMinutes += 60; 
      currentWeather = WEATHERS[Math.floor(Math.random() * WEATHERS.length)];
      updateClockUI();
    }
    function gx2x(gx) { return gx * PX; }
    function gy2y(gy) { return gy * PX; }

    function isWalkable(gx, gy) {
      if (gx < 3 || gy < 3 || gx >= 76 || gy >= 45) return false;
      if (gy === 40 && (gx < 38 || gx > 46)) return false;
      for (const z of ZONES) {
        const b = z.bounds;
        if (gx >= b.gx && gx < b.gx + b.gw && gy >= b.gy && gy < b.gy + b.gh) {
          if (z.id === "houji" && gx >= 34 && gy >= 15) continue; 
          if (z.id === "shaoen" && gx < 55 && gy >= 15) continue;
          if (z.id === "jiusi" && gx >= 34 && gy >= 24) continue;
          if (z.name !== "" && gx === z.entrance.gx && gy === z.entrance.gy) return true;
          return false;
        }
      }
      return true;
    }
    function heuristic(a, b) { return abs(a.gx - b.gx) + abs(a.gy - b.gy); }
    function astar(start, goal) {
      const key = (p) => `${p.gx},${p.gy}`;
      const open = [{ ...start, g: 0, f: heuristic(start, goal), parent: null }];
      const closed = new Map();
      while (open.length > 0) {
        open.sort((a, b) => a.f - b.f);
        const current = open.shift();
        if (current.gx === goal.gx && current.gy === goal.gy) {
          const path = []; let node = current;
          while (node) { path.unshift({ gx: node.gx, gy: node.gy }); node = node.parent; }
          return path;
        }
        closed.set(key(current), current);
        for (const [dx, dy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
          const nx = current.gx + dx, ny = current.gy + dy;
          if (!isWalkable(nx, ny) || closed.has(`${nx},${ny}`)) continue;
          const g = current.g + 1;
          const existing = open.find(n => n.gx === nx && n.gy === ny);
          if (existing) { if (g < existing.g) { existing.g = g; existing.f = g + heuristic({gx:nx,gy:ny}, goal); existing.parent = current; } }
          else open.push({ gx: nx, gy: ny, g, f: g + heuristic({gx:nx,gy:ny}, goal), parent: current });
        }
      }
      return [];
    }

    let hoverZone = null, travelPath = [], travelProgress = 0;

      if (currentState === "WATER_GAME") { drawWaterGame(); return; }

      drawMap();

      if (currentState === "TRAVELING") {
        const idx = floor(travelProgress);
        if (idx < travelPath.length - 1) {
          const a = travelPath[idx], b = travelPath[idx + 1];
          const t = travelProgress - idx;
          shared.playerPos = { gx: lerp(a.gx, b.gx, t), gy: lerp(a.gy, b.gy, t) };
          travelProgress += 0.15;
        } else {
          shared.playerPos = { ...travelPath[travelPath.length - 1] };
          travelPath = []; currentState = "ZONE";
          enterZone(shared.targetZone);
        }
      } else if (currentState === "OVERVIEW") {
        if (mouseX > 0 && mouseY > 0) {
          let pos = getLogicalCoords(mouseX, mouseY);
          const gx = pos.x / PX, gy = pos.y / PX;
          hoverZone = ZONES.find(z => z.name !== "" && gx >= z.bounds.gx && gx < z.bounds.gx + z.bounds.gw && gy >= z.bounds.gy && gy < z.bounds.gy + z.bounds.gh) || null;
        } else hoverZone = null;
      }
    }

    function drawMap() {
      background("#2C3E50"); 
      push(); stroke("#E8E8F0"); strokeWeight(3); noFill();
      line(gx2x(3), gy2y(3), gx2x(76), gy2y(3)); line(gx2x(3), gy2y(3), gx2x(3), gy2y(40));
      line(gx2x(76), gy2y(3), gx2x(76), gy2y(40)); line(gx2x(3), gy2y(40), gx2x(38), gy2y(40));
      line(gx2x(46), gy2y(40), gx2x(76), gy2y(40)); pop();

      for (const z of ZONES) {
        const x = gx2x(z.bounds.gx), y = gy2y(z.bounds.gy);
        const w = z.bounds.gw * PX, h = z.bounds.gh * PX;
        fill(z.color); stroke("#E8E8F0"); strokeWeight(1.5);

        if (z.id === "houji") {
          beginShape(); vertex(x, y); vertex(x + w, y); vertex(x + w, y + 3*PX); vertex(x + 2*PX, y + 3*PX); vertex(x + 2*PX, y + h); vertex(x, y + h); endShape(CLOSE);
        } else if (z.id === "shaoen") {
          beginShape(); vertex(x, y); vertex(x + w, y); vertex(x + w, y + h); vertex(x + 6*PX, y + h); vertex(x + 6*PX, y + 3*PX); vertex(x, y + 3*PX); endShape(CLOSE);
        } else if (z.id === "jiusi") {
          beginShape(); vertex(x, y); vertex(x + w, y); vertex(x + w, y + 3*PX); vertex(x + 2*PX, y + 3*PX); vertex(x + 2*PX, y + h); vertex(x, y + h); endShape(CLOSE);
        } else {
          rect(x, y, w, h);
        }

        if (z.id === "track") {
          fill("#C0392B"); noStroke(); ellipse(x + w/2, y + h/2, w - 20, h - 40);
          fill("#27AE60"); ellipse(x + w/2, y + h/2, w - 50, h - 80);
          stroke("#E8E8F0"); noFill(); ellipse(x + w/2, y + h/2, w - 20, h - 40);
        }

        if (z.name !== "") {
          if (shared.activeTasks.includes(z.id)) {
            fill(255, 77, 77, 150 + sin(frameCount * 0.2) * 105); noStroke();
            ellipse(gx2x(z.entrance.gx), gy2y(z.entrance.gy), 14, 14);
          } else {
            fill("#FF4D4D"); noStroke(); ellipse(gx2x(z.entrance.gx), gy2y(z.entrance.gy), 6, 6);
          }
          fill("#FFFFFF"); textAlign(CENTER, CENTER); textSize(12);
          if (z.id === "houji") text(z.name, x + w/2, y + 1.5*PX);
          else if (z.id === "shaoen") text(z.name, x + 4*PX, y + 1.5*PX);
          else if (z.id === "jiusi") text(z.name, x + 4*PX, y + 1.5*PX);
          else if (z.id === "flag") text(z.name, x + w/2, y + h/2 + 20);
          else text(z.name, x + w/2, y + h/2);
        }
      }

      const px = gx2x(shared.playerPos.gx), py = gy2y(shared.playerPos.gy);
      fill("#2F6BFF"); stroke("#FFFFFF"); strokeWeight(2); ellipse(px, py, 12, 12);

      if (hoverZone && currentState === "OVERVIEW") {
        noFill(); stroke("#FFB84D"); drawingContext.setLineDash([5, 5]); rect(gx2x(hoverZone.bounds.gx)-2, gy2y(hoverZone.bounds.gy)-2, hoverZone.bounds.gw*PX+4, hoverZone.bounds.gh*PX+4); drawingContext.setLineDash([]);
      }
    }

    function keyPressed() {
      if (currentState === "TITLE") { currentState = "TUTORIAL"; tutorialPanel.style.display = "block"; }
      if (currentState === "MINIGAME") {
        if (key === 'a' || key === 'A') checkHit("left");
        if (key === 'd' || key === 'D') checkHit("right");
      }
    }

    // 强制在用户点击的瞬间触发播放
    function playAudioSafe(audioEl) {
      if (!audioEl) return;
      audioEl.currentTime = 0;
      let playPromise = audioEl.play();
      
      if (playPromise !== undefined) {
        playPromise.then(() => {
          console.log("音乐播放成功！");
        }).catch(error => {
          console.log("Safari 拦截了，尝试终极破防：", error);
          // 静音播放，然后瞬间取消静音
          audioEl.muted = true;
          audioEl.play().then(() => {
            audioEl.muted = false;
          }).catch(e => {
            console.log("彻底失败，可能缺少物理交互。");
          });
        });
      }
    }

    function handleInteraction(clientX, clientY) {
      const now = Date.now();
      if (now - lastInteractionTime < 100) return; 
      lastInteractionTime = now;
      const pos = getLogicalCoords(clientX, clientY);

      if (currentState === "TITLE") { 
        currentState = "TUTORIAL"; tutorialPanel.style.display = "block"; return; 
      }
      
      if (currentState === "CREDITS") {
        if (creditsY < -1500) { 
          // 在用户点击的同步栈中，强制播放！
          if (isHiddenEnding) {
            currentState = "HIDDEN_ENDING";
            hiddenY = 200; 
            playAudioSafe(audioHidden); 
          } else {
            currentState = "SCHOOL_SONG";
            songY = 720;
            playAudioSafe(audioSchool); 
          }
        }
        return;
      }

      if (currentState === "SCHOOL_SONG" || currentState === "HIDDEN_ENDING") {
        if ((currentState === "SCHOOL_SONG" && songY < -1500) || (currentState === "HIDDEN_ENDING" && hiddenY < -1500)) {
          resetGame();
        }
        return;
      }

      if (currentState === "MINIGAME") {
        if (pos.x < 1280 / 2) checkHit("left");
        else checkHit("right");
        return;
      }

      if (currentState === "SORTING_GAME") { checkSortingHit(pos.x, pos.y); return; }
      if (currentState === "CLEANING_GAME") { checkCleaningHit(pos.x, pos.y); return; }
      if (currentState === "WATER_GAME") { checkWaterHit(pos.x, pos.y); return; }

      if (currentState === "OVERVIEW") {
        const gx = pos.x / PX, gy = pos.y / PX;
        const target = ZONES.find(z => z.name !== "" && gx >= z.bounds.gx && gx < z.bounds.gx + z.bounds.gw && gy >= z.bounds.gy && gy < z.bounds.gy + z.bounds.gh);
        if (target) {
          const path = astar(shared.playerPos, target.entrance);
          if (path.length > 0) { 
            travelPath = path; travelProgress = 0; shared.targetZone = target; currentState = "TRAVELING"; 
          }
        }
      }
    }

    function nextLine() {
      if (dialogueQueue.length > 0) {
        currentLine = dialogueQueue.shift();
        speakerEl.textContent = currentLine.speaker;
        globalLog.push(currentLine); 
        
        textEl.textContent = ""; charIndex = 0; isTyping = true; nextIndicator.style.display = "none";
        clearInterval(typingTimer);
        typingTimer = setInterval(() => {
          textEl.textContent = currentLine.text.slice(0, ++charIndex);
          if (charIndex >= currentLine.text.length) { 
            clearInterval(typingTimer); isTyping = false; nextIndicator.style.display = "block"; 
          }
        }, 40);
      } else {
        nextIndicator.style.display = "none";
        textEl.innerHTML = "（点击右上角返回校园）";
        speakerEl.textContent = "";
        if (onQueueComplete) {
          const cb = onQueueComplete; onQueueComplete = null; cb();
        }
      }
    }

      if (isTyping) {
        clearInterval(typingTimer);

    function spawnNote() {
      if (notesSpawned >= 10) return;
      notes.push({ x: 640, y: 400, dir: Math.random() > 0.5 ? "left" : "right", speed: 8, hit: false });
      notesSpawned++;

    function drawMinigame() {
      background("#1A2536"); 
      fill(255, 184, 77, 20); noStroke(); rect(0, 0, width/2, height);
      fill(47, 107, 255, 20); rect(width/2, 0, width/2, height);
      fill(255, 255, 255, 100); textSize(32); textAlign(CENTER, CENTER);
      text("点 击 左 侧", width/4, height - 150); text("点 击 右 侧", width*3/4, height - 150);

      for (let i = hitEffects.length - 1; i >= 0; i--) {
        let fx = hitEffects[i]; fx.alpha -= 15;
        if (fx.alpha <= 0) hitEffects.splice(i, 1);
        else { fill(39, 174, 96, fx.alpha); noStroke(); ellipse(fx.x, 400, 120, 120); }
      }
      fill("#2F6BFF"); noStroke(); ellipse(640, 400, 40, 40);
      noFill(); stroke("#FFB84D"); strokeWeight(4); ellipse(340, 400, 100, 100); ellipse(940, 400, 100, 100);

      for (let i = notes.length - 1; i >= 0; i--) {
        let n = notes[i];
        if (!n.hit) {
          if (n.dir === "left") n.x -= n.speed; else n.x += n.speed;
          fill("#E8E8F0"); noStroke(); ellipse(n.x, n.y, 30, 30);
          if (n.x < -100 || n.x > 1380) { notes.splice(i, 1); checkGameEnd(); }
        }
      }
    }

    function checkHit(dir) {
      let targetX = dir === "left" ? 340 : 940, closestIdx = -1, minDist = 120; 
      for (let i = 0; i < notes.length; i++) {
        if (!notes[i].hit && notes[i].dir === dir) {
          let d = Math.abs(notes[i].x - targetX);
          if (d < minDist) { minDist = d; closestIdx = i; }
        }
      }
      if (closestIdx !== -1) {
        notes.splice(closestIdx, 1); minigameScore++;
        rhythmScoreEl.textContent = `${minigameScore} / 10`;
        rhythmScoreEl.style.color = "#27AE60"; setTimeout(() => rhythmScoreEl.style.color = "#FFB84D", 200);
        hitEffects.push({ x: targetX, alpha: 255 });
      }
      checkGameEnd();
    }

    function checkGameEnd() {
      if (minigameScore >= 7) endMinigame(true);
      else if (notesSpawned >= 10 && notes.length === 0 && minigameScore < 7) endMinigame(false);

    function checkSortingHit(x, y) {
      if (!sortingGame.active) return;

                       y > sortingGame.boxRight.y && y < sortingGame.boxRight.y + sortingGame.boxRight.h;

      if (isLeftBox || isRightBox) {
        let isEven = sortingGame.currentNum % 2 === 0;
        let correct = (isEven && isRightBox) || (!isEven && isLeftBox);

      for (let i = 0; i < songLyrics.length; i++) {
        let item = songLyrics[i];
        fill(item.color);
        textSize(item.size);
        text(item.text, width / 2, currentY);
        currentY += item.spacing;
      }

      songY -= 1.2; 

      if (songY < -1500) {
        fill(255, 255, 255, 150); textSize(18);
        text("（点击屏幕重新开始游戏）", width / 2, 600);
      }
    }

    function drawHiddenEnding() {
      background(10, 5, 5);

      push();
      noFill();
      stroke(255, 77, 77, 30);
      strokeWeight(3);
      let wave = sin(frameCount * 0.03) * 100;
      ellipse(width/2, height/2, 600 + wave, 600 + wave);
      pop();

      textAlign(CENTER, CENTER);
      let currentY = hiddenY;

      for (let i = 0; i < hiddenText.length; i++) {
        let item = hiddenText[i];
        fill(item.color);
        textSize(item.size);
        text(item.text, width / 2, currentY);
        currentY += item.spacing;
      }

      hiddenY -= 0.6; 

      if (hiddenY < -1500) {
        fill(255, 255, 255, 150); textSize(18);
        text("（点击屏幕重新开始游戏）", width / 2, 600);
      }
    }

    function resetGame() {
      currentState = "TITLE";
      
      shared.tasksCompleted = 0;
      shared.visitedZones = [];
      shared.activeTasks = [];
      shared.papers = 0;
      shared.hasEnded = false;
      shared.helpedList.clear();
      isHiddenEnding = false;
      
      currentMinutes = 7 * 60 + 30;
      currentWeather = WEATHERS[0];
      updateClockUI();
      
      shared.playerPos = { ...START_POS };
      shared.targetZone = null;
      
      updateTaskUI();
      overlay.style.display = "none";
      backBtn.style.display = "none";
      choicePanel.style.display = "none";
      
      if (audioSchool) { audioSchool.pause(); audioSchool.currentTime = 0; }
      if (audioHidden) { audioHidden.pause(); audioHidden.currentTime = 0; }
    }

    function renderLog() {
      logContent.innerHTML = "";
      globalLog.forEach(item => {
        let highlightedText = item.text.replace(/【(.*?)】/g, '<span class="task-hl">【$1】</span>');
        logContent.innerHTML += `<p><span class="log-speaker">${item.speaker}:</span>${highlightedText}</p>`;
      });
      logContent.scrollTop = logContent.scrollHeight;
    }
  </script>
</body>
</html>
