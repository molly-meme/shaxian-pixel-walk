    function isWalkable(gx, gy) {
      if (gx < 3 || gy < 3 || gx >= 76 || gy >= 45) return false;
      if (gy === 40 && (gx < 38 || gx > 46)) return false;
      for (const z of ZONES) {
        const b = z.bounds;
        if (gx >= b.gx && gx < b.gx + b.gw && gy >= b.gy && gy < b.gy + b.gh) {
          if (z.id === "houji" && gx >= 34 && gy >= 15) continue; 
          if (z.id === "shaoen" && gx < 55 && gy >= 15) continue;
          if (z.id === "jiusi" && gx >= 34 && gy >= 24) continue;
          if (z.name !== "" && gx === z.entrance.gx && gy === z.entrance.gy) return true;
          return false;
        }
      }
      return true;
    }
    function heuristic(a, b) { return abs(a.gx - b.gx) + abs(a.gy - b.gy); }
    function astar(start, goal) {
      const key = (p) => `${p.gx},${p.gy}`;
      const open = [{ ...start, g: 0, f: heuristic(start, goal), parent: null }];
      const closed = new Map();
      let iterations = 0;
      while (open.length > 0) {
        if (++iterations > 5000) return []; 
        open.sort((a, b) => a.f - b.f);
        const current = open.shift();
        if (current.gx === goal.gx && current.gy === goal.gy) {
          const path = []; let node = current;
          while (node) { path.unshift({ gx: node.gx, gy: node.gy }); node = node.parent; }
          return path;
        }
        closed.set(key(current), current);
        for (const [dx, dy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
          const nx = current.gx + dx, ny = current.gy + dy;
          if (!isWalkable(nx, ny) || closed.has(`${nx},${ny}`)) continue;
          const g = current.g + 1;
          const existing = open.find(n => n.gx === nx && n.gy === ny);
          if (existing) { if (g < existing.g) { existing.g = g; existing.f = g + heuristic({gx:nx,gy:ny}, goal); existing.parent = current; } }
          else open.push({ gx: nx, gy: ny, g, f: g + heuristic({gx:nx,gy:ny}, goal), parent: current });
        }
      }
      return [];
    }

    function handleInteraction(clientX, clientY) {
      const now = Date.now();
      if (now - lastInteractionTime < 100) return; 
      lastInteractionTime = now;
      const pos = getLogicalCoords(clientX, clientY);
       if (currentState === "GAMEOVER") { location.reload(); return; }
      if (currentState === "PHYSICS_GAME") { checkPhysicsHit(pos.x, pos.y); return; }
      if (currentState === "FIRE_GAME") { checkFireHit(pos.x, pos.y); return; }

      if (currentState === "TITLE") { 
        currentState = "TUTORIAL"; tutorialPanel.style.display = "block"; return; 
      }
      
      if (currentState === "CREDITS") {
        if (creditsY < -4500) { 
          resetGame();
        }
        return;
      }

      if (currentState === "MINIGAME") {
        if (pos.x < 1280 / 2) checkHit("left");
        else checkHit("right");
        return;
      }

      if (currentState === "SET_GAME") { checkSetHit(pos.x, pos.y); return; }
      if (currentState === "CLEANING_GAME") { checkCleaningHit(pos.x, pos.y); return; }
      if (currentState === "WATER_GAME") { checkWaterHit(pos.x, pos.y); return; }
      if (currentState === "BIO_GAME") { checkBioHit(pos.x, pos.y); return; }
      if (currentState === "ACC_GAME") { checkAccHit(pos.x, pos.y); return; }
      if (currentState === "CHEM_GAME") { checkChemHit(pos.x, pos.y); return; }
      if (currentState === "MATH_GAME") { checkMathHit(pos.x, pos.y); return; }
      if (currentState === "LIUYI_GAME") { checkLiuyiHit(pos.x, pos.y); return; }

      if (currentState === "OVERVIEW") {
        const gx = pos.x / PX, gy = pos.y / PX;
        const target = ZONES.find(z => z.name !== "" && gx >= z.bounds.gx && gx < z.bounds.gx + z.bounds.gw && gy >= z.bounds.gy && gy < z.bounds.gy + z.bounds.gh);
        if (target) {          // 1. 放学阶段 (点击任意建筑结局)
          if (isSchoolOver) {
            triggerEnding();
            return;
          }

          // 2. 火灾逃生阶段
          if (nightPhase === 2 && !isFireEscaped) {
            if (target.id === "yuxiu") {
              isFireEscaped = true;
              startDialogue([ { speaker: "旁白", text: "你毅然冲回火场！必须马上灭火！" } ], () => { startFireGame(); });
            } else {
              isFireEscaped = true;
              startDialogue([ { speaker: "旁白", text: "你成功逃出。" }, { speaker: "消防员", text: "火已扑灭，赶紧回去继续晚自习吧。" } ], () => { startNightStudyPhase3(); });
            }
            return;
          }

          // 3. 强制晚自习检查 (18:30 后)
          if (currentMinutes >= 18 * 60 + 30 && !isNightStudy) {
            if (target.id === "yuxiu") { startNightStudyPhase1(); } 
            else { triggerGameOver("晚自习时间到了，你居然在校园里闲逛，被教导主任抓住了！"); }
            return;
          }
          const path = astar(shared.playerPos, target.entrance);
          if (path.length > 0) { 
            travelPath = path; travelProgress = 0; shared.targetZone = target; currentState = "TRAVELING"; 
          }
        }
      }
    }

      // ================= 背景渲染逻辑 =================
      let useImg = null;

      if (zone.id === "track") {
        useImg = trackBgImg;
      } else if (zone.id === "shaoen") {
        useImg = (currentMinutes >= 18 * 60) ? shaoenNightImg : shaoenMorningImg;
      } else if (zone.id === "siyuan") {
        useImg = (currentMinutes >= 18 * 60) ? siyuanNightImg : siyuanBgImg;
      } else if (zone.id === "liuyi") {
        useImg = (currentMinutes >= 18 * 60) ? liuyiNightImg : liuyiMorningImg;
      } else if (["ruyuan", "guiyuan", "meiyuan", "zhuyuan"].includes(zone.id)) {
        useImg = (currentMinutes >= 18 * 60) ? dormNightImg : dormDayImg;
      }
      // 统一绘制逻辑
      if (useImg) {
        let imgAspect = useImg.width / useImg.height;
        let screenAspect = width / height;
        let drawW, drawH;
        if (imgAspect > screenAspect) { drawH = height; drawW = height * imgAspect; } 
        else { drawW = width; drawH = width / imgAspect; }
        image(useImg, (width - drawW) / 2, (height - drawH) / 2, drawW, drawH);
      } else {
        // 如果没图或者没设置，就显示原本的底色
        fill(zone.color); noStroke(); rect(0, 0, width, height);

    function completeTask(taskId) {
      shared.activeTasks = shared.activeTasks.filter(t => t !== taskId);
      advanceTime();
      textEl.innerHTML = "（任务完成，点击右上角返回校园）";
      if (shared.activeTasks.length === 0) {
        globalLog.push({ speaker: "旁白", text: "【提示】陈竞交代的任务都完成了，回田径场找他复命吧！" });
      }
    }

    function startDialogue(lines, completeCallback) {
      dialogueQueue = [...lines];
      onQueueComplete = completeCallback;
      nextLine();
    }

    function nextLine() {
      if (dialogueQueue.length > 0) {
        currentLine = dialogueQueue.shift();
        speakerEl.textContent = currentLine.speaker;
        globalLog.push(currentLine);

    function spawnNote() {
      if (notesSpawned >= 10) return;
      notes.push({ x: 640, y: 400, dir: Math.random() > 0.5 ? "left" : "right", speed: 8, hit: false });

    function drawMinigame() {
      background("#1A2536"); 
      fill(255, 184, 77, 20); noStroke(); rect(0, 0, width/2, height);
      fill(47, 107, 255, 20); rect(width/2, 0, width/2, height);
      fill(255, 255, 255, 100); textSize(32); textAlign(CENTER, CENTER);
      text("点 击 左 侧", width/4, height - 150); text("点 击 右 侧", width*3/4, height - 150);

      for (let i = hitEffects.length - 1; i >= 0; i--) {
        let fx = hitEffects[i]; fx.alpha -= 15;
        if (fx.alpha <= 0) hitEffects.splice(i, 1);
        else { fill(39, 174, 96, fx.alpha); noStroke(); ellipse(fx.x, 400, 120, 120); }
      }
      fill("#2F6BFF"); noStroke(); ellipse(640, 400, 40, 40);
      noFill(); stroke("#FFB84D"); strokeWeight(4); ellipse(340, 400, 100, 100); ellipse(940, 400, 100, 100);

      for (let i = notes.length - 1; i >= 0; i--) {
        let n = notes[i];
        if (!n.hit) {
          if (n.dir === "left") n.x -= n.speed; else n.x += n.speed;
          fill("#E8E8F0"); noStroke(); ellipse(n.x, n.y, 30, 30);
          if (n.x < -100 || n.x > 1380) { notes.splice(i, 1); checkGameEnd(); }
        }
      }
    }

    function checkHit(dir) {
      let targetX = dir === "left" ? 340 : 940, closestIdx = -1, minDist = 120; 
      for (let i = 0; i < notes.length; i++) {
        if (!notes[i].hit && notes[i].dir === dir) {
          let d = Math.abs(notes[i].x - targetX);
          if (d < minDist) { minDist = d; closestIdx = i; }
        }
      }
      if (closestIdx !== -1) {
        notes.splice(closestIdx, 1); minigameScore++;
        rhythmScoreEl.textContent = `${minigameScore} / 10`;
        rhythmScoreEl.style.color = "#27AE60"; setTimeout(() => rhythmScoreEl.style.color = "#FFB84D", 200);
        hitEffects.push({ x: targetX, alpha: 255 });
      }
      checkGameEnd();
    }

    function checkGameEnd() {
      if (minigameScore >= 7) endMinigame(true);

    function drawMathFormula(parts, cx, cy, fontSize) {
      textSize(fontSize);
      let totalWidth = 0;
      let spacing = 4;
      for (let p of parts) {
        if (p.type === "text") {
          totalWidth += textWidth(p.value) + spacing;
        } else if (p.type === "frac") {
          let nw = textWidth(p.num);
          let dw = textWidth(p.den);
          totalWidth += Math.max(nw, dw) + spacing * 2;
        }
      }
      
      let startX = cx - totalWidth / 2;
      let currentX = startX;
      
      for (let p of parts) {
        if (p.type === "text") {
          fill("#1A1A2E");
          textAlign(LEFT, CENTER);
          text(p.value, currentX, cy);
          currentX += textWidth(p.value) + spacing;
        } else if (p.type === "frac") {
          let nw = textWidth(p.num);
          let dw = textWidth(p.den);
          let fw = Math.max(nw, dw);
          
          fill("#1A1A2E");
          textAlign(CENTER, BOTTOM);
          text(p.num, currentX + fw/2, cy - 4);
          
          fill("#1A1A2E");
          textAlign(CENTER, TOP);
          text(p.den, currentX + fw/2, cy + 4);
          
          stroke("#1A1A2E");
          strokeWeight(2);
          line(currentX, cy, currentX + fw, cy);
          noStroke();
          
          currentX += fw + spacing * 2;
        }
      }
    }

    function startLiuyiGame(onWin, onLose) {
      currentState = "LIUYI_GAME";

      liuyiGame.spawnTimer = 0;

      liuyiGame.onLose = onLose;

      let countdown = setInterval(() => {
        if (!liuyiGame.active) { clearInterval(countdown); return; }

      }, 1000);
    }

    function drawLiuyiGame() {
      background("#1A2536");

      // 绘制轨道
      const laneW = 1280 / 4;
      stroke("#2C3E50"); strokeWeight(2);
      for (let i = 1; i < 4; i++) {
        line(i * laneW, 0, i * laneW, height);
      }

      // 判定线
      stroke("#FFB84D"); strokeWeight(6);
      line(0, 640, width, 640);
      noStroke();

      // 顶部 UI
      fill("#FFB84D"); textSize(36); textAlign(CENTER, CENTER);
      text(`整理音符：还有 ${liuyiGame.timer} 秒`, 640, 40);
      fill("#E8E8F0"); textSize(24);
      text(`已收集：${liuyiGame.score} / ${liuyiGame.targetScore}`, 640, 90);

      // 生成音符 (每 20 帧生成一个)
      if (frameCount % 20 === 0 && liuyiGame.timer > 0) {
        let lane = Math.floor(Math.random() * 4);
        let x = lane * laneW + laneW / 2;
        liuyiGame.notes.push({ x: x, y: -40, lane: lane, hit: false, color: lane % 2 === 0 ? "#FFB84D" : "#4ECDC4" });
      }

      // 更新并绘制音符
      for (let i = liuyiGame.notes.length - 1; i >= 0; i--) {
        let n = liuyiGame.notes[i];
        if (!n.hit) {
          n.y += 6;
          if (n.y > height + 50) {
            liuyiGame.notes.splice(i, 1); // 漏掉了
          } else {
            fill(n.color); stroke("#FFF"); strokeWeight(3);
            rect(n.x - 40, n.y - 20, 80, 40, 8);
          }
        } else {
          // 击中特效
          fill(255, 255, 255, 100);
          ellipse(n.x, n.y, 100, 100);
          liuyiGame.notes.splice(i, 1);
        }
      }
    }

    function checkLiuyiHit(x, y) {
      if (!liuyiGame.active) return;
      const laneW = 1280 / 4;
      let lane = Math.floor(x / laneW);
      if (lane < 0 || lane >= 4) return;

      // 找该轨道最下面未击中的音符
      let closestIdx = -1;
      let maxY = -1000;
      for (let i = 0; i < liuyiGame.notes.length; i++) {
        if (liuyiGame.notes[i].lane === lane && !liuyiGame.notes[i].hit) {
          if (liuyiGame.notes[i].y > maxY) {
            maxY = liuyiGame.notes[i].y;
            closestIdx = i;
          }
        }
      }

      if (closestIdx !== -1) {
        let n = liuyiGame.notes[closestIdx];
        // 判定范围：y在 500 到 700 之间算作击中
        if (n.y > 500 && n.y < 700) {
          n.hit = true;
          liuyiGame.score++;
          if (liuyiGame.score >= liuyiGame.targetScore) {
            liuyiGame.active = false;
            endLiuyiGame(true);
          }
        }
      }
    }

    function endLiuyiGame(isWin) {
      currentState = "ZONE";
      rhythmUI.style.display = "none"; overlay.style.display = "block"; backBtn.style.display = "block"; logBtn.style.display = "block";
      if (isWin) {
        if (liuyiGame.onWin) liuyiGame.onWin();
      } else {
        if (liuyiGame.onLose) liuyiGame.onLose();
      }
    }

        creditsText.push({ text: "—————————————", size: 20, color: "#555", spacing: 100 });
        hiddenText.forEach(item => {
          creditsText.push({ text: item.text, size: item.size, color: item.color, spacing: item.spacing });
        });
      }

      creditsText.push({ text: "—————————————", size: 20, color: "#555", spacing: 100 });
      creditsText.push({ text: "沙县一中校歌", size: 28, color: "#FFB84D", spacing: 60 });
      songLyrics.forEach(item => {
        creditsText.push({ text: item.text, size: item.size, color: item.color, spacing: item.spacing });
      });

      creditsText.push({ text: "—————————————", size: 20, color: "#555", spacing: 100 });
      creditsText.push({ text: "感谢游玩", size: 36, color: "#FFB84D", spacing: 80 });
    }

    function drawCredits() {
      background(10, 10, 15); 

      textAlign(CENTER, CENTER);
      let currentY = creditsY;

      for (let i = 0; i < creditsText.length; i++) {
        let item = creditsText[i];
        fill(item.color);
        textSize(item.size);
        text(item.text, width / 2, currentY);
        currentY += item.spacing;
      }

      creditsY -= 1.5;

      if (creditsY < -4500) { 
        fill(255, 255, 255, 150); textSize(20);
        text("（点击屏幕重新开始）", width / 2, 600);
      }
    }

        // ===== 新增剧情和电学/消防小游戏 =====
    function triggerGameOver(reason) {
      gameOverReason = reason;
      currentState = "GAMEOVER";
      overlay.style.display = "none"; backBtn.style.display = "none"; choicePanel.style.display = "none";
    }

    function startNightStudyPhase1() {
      isNightStudy = true; nightPhase = 1;
      overlay.style.display = "block"; backBtn.style.display = "none"; logBtn.style.display = "none";
       currentState = "ZONE";
      overlay.style.display = "block"; 
      backBtn.style.display = "none"; // 晚自习不能回地图，隐藏返回按钮
      logBtn.style.display = "block";
      choicePanel.style.display = "none";
      fill("#6B5B4A"); noStroke(); rect(0, 0, width, height); // 给背景铺一层室内颜色（和毓秀楼一致）
      startDialogue([
        { speaker: "旁白", text: "你准时来到了毓秀楼教室，准备开始晚自习。" },
        { speaker: "同学", text: "哎呀，这饮水机怎么一直在漏水！" },
        { speaker: "旁白", text: "突然，饮水机内部发出一声闷响，似乎是电路短路炸开了！" },
        { speaker: "同学", text: "快！你物理好，快来看看这电路图怎么修！" }
      ], () => { startPhysicsGame(); });
    }

    function startNightStudyPhase3() {
      isNightStudy = true; nightPhase = 3;
       currentState = "ZONE";
      overlay.style.display = "block"; 
      backBtn.style.display = "none"; 
      logBtn.style.display = "block";
      choicePanel.style.display = "none";
      fill("#6B5B4A"); noStroke(); rect(0, 0, width, height);
      overlay.style.display = "block"; backBtn.style.display = "none"; logBtn.style.display = "none";
      startDialogue([
        { speaker: "班主任", text: "安静！刚才的火灾虽然是意外，但你们也太不小心了。" },
        { speaker: "班主任", text: "尤其是你，为了惩罚你，把《琵琶行》抄写一千遍！现在就开始！" }
      ], () => {
        showChoices([
          { text: "老老实实抄写一千遍", action: () => { triggerGameOver("你抄断了手，最终累死在了书桌上..."); } },
          { text: "趁老师不注意偷偷溜走！", action: () => {
            startDialogue([ { speaker: "旁白", text: "你趁着班主任转身的瞬间，冲出了教室！" }, { speaker: "旁白", text: "放学啦！点击地图上的任意建筑即可离开学校！" } ], () => {
              isSchoolOver = true; currentState = "OVERVIEW";
              overlay.style.display = "none"; backBtn.style.display = "none"; choicePanel.style.display = "none";
            });
          }}
        ]);
      });
    }

    function nextPhysicsQuestion() {
      if (shuffledPhysics.length === 0) shuffledPhysics = [...physicsQuestions].sort(() => 0.5 - Math.random());
      const q = shuffledPhysics.pop(); physicsGame.currentQ = q.text; physicsGame.correctSide = q.side;
    }
    function startPhysicsGame() {
      currentState = "PHYSICS_GAME";
      overlay.style.display = "none"; backBtn.style.display = "none"; logBtn.style.display = "none";
      physicsGame.active = true; physicsGame.timer = 15; physicsGame.score = 0; nextPhysicsQuestion();
      let cd = setInterval(() => { if (!physicsGame.active) { clearInterval(cd); return; } physicsGame.timer--; if (physicsGame.timer <= 0) { clearInterval(cd); endPhysicsGame(false); } }, 1000);
    }
    function drawPhysicsGame() {
      background("#1A2536"); fill("#FFB84D"); textSize(36); textAlign(CENTER, CENTER); text(`高中电学：还有 ${physicsGame.timer} 秒`, 640, 70);
      fill("#E8E8F0"); textSize(24); text(`已答对：${physicsGame.score} / 4`, 640, 120);
      fill("#E8E8F0"); stroke("#FFB84D"); strokeWeight(4); rect(180, 165, 920, 140, 16);
      fill("#1A1A2E"); noStroke(); textSize(28); text(physicsGame.currentQ, 640, 235);
      fill("#27AE60"); stroke("#E8E8F0"); strokeWeight(4); rect(physicsGame.boxLeft.x, physicsGame.boxLeft.y, physicsGame.boxLeft.w, physicsGame.boxLeft.h, 12);
      fill("#FFFFFF"); textSize(32); text("正确", physicsGame.boxLeft.x + 100, physicsGame.boxLeft.y + 60);
      fill("#C0392B"); stroke("#E8E8F0"); strokeWeight(4); rect(physicsGame.boxRight.x, physicsGame.boxRight.y, physicsGame.boxRight.w, physicsGame.boxRight.h, 12);
      fill("#FFFFFF"); textSize(32); text("错误", physicsGame.boxRight.x + 100, physicsGame.boxRight.y + 60);
    }
    function checkPhysicsHit(x, y) {
      if (!physicsGame.active) return;
      let isL = x > physicsGame.boxLeft.x && x < physicsGame.boxLeft.x + physicsGame.boxLeft.w && y > physicsGame.boxLeft.y && y < physicsGame.boxLeft.y + physicsGame.boxLeft.h;
      let isR = x > physicsGame.boxRight.x && x < physicsGame.boxRight.x + physicsGame.boxRight.w && y > physicsGame.boxRight.y && y < physicsGame.boxRight.y + physicsGame.boxRight.h;
      if (isL || isR) {
        let cor = (physicsGame.correctSide === "left" && isL) || (physicsGame.correctSide === "right" && isR);
        if (cor) { physicsGame.score++; if (physicsGame.score >= 4) { physicsGame.active = false; endPhysicsGame(true); return; } } 
        else { physicsGame.timer = Math.max(0, physicsGame.timer - 3); }
        nextPhysicsQuestion();
      }
    }
    function endPhysicsGame(isWin) {
     currentState = "ZONE";
      overlay.style.display = "block"; 
      backBtn.style.display = "none"; 
      logBtn.style.display = "none";
      fill("#6B5B4A"); noStroke(); rect(0, 0, width, height); // 铺一层室内底色
      if (isWin) startDialogue([ { speaker: "旁白", text: "你成功接好了线路，饮水机恢复了正常！" } ], () => { triggerFireEvent(); });
      else startDialogue([ { speaker: "旁白", text: "你没修好，饮水机突然闪出一阵火花！" } ], () => { triggerFireEvent(); });
    }

    function triggerFireEvent() {
      currentState = "OVERVIEW"; overlay.style.display = "none"; backBtn.style.display = "none"; choicePanel.style.display = "none";
      nightPhase = 2; fireTimer = 2000; // 2秒倒计时
    }
    function startFireGame() {
      currentState = "FIRE_GAME"; overlay.style.display = "none"; backBtn.style.display = "none"; logBtn.style.display = "none";
      fireGame.active = true; fireGame.timer = 15; fireGame.score = 0; fireGame.fires = [];
      for (let i = 0; i < 15; i++) { fireGame.fires.push({ x: Math.random() * 1000 + 140, y: Math.random() * 400 + 150, size: Math.random() * 40 + 40, hit: false }); }
      let cd = setInterval(() => { if (!fireGame.active) { clearInterval(cd); return; } fireGame.timer--; if (fireGame.timer <= 0) { clearInterval(cd); endFireGame(); } }, 1000);
    }
    function drawFireGame() {
      background("#330000"); fill("#FFB84D"); textSize(36); textAlign(CENTER, CENTER); text(`灭火行动：还有 ${fireGame.timer} 秒`, 640, 70);
      fill("#E8E8F0"); textSize(24); text(`已扑灭：${fireGame.score} / 15`, 640, 120);
      for (let f of fireGame.fires) { if (!f.hit) { fill("#FF4D4D"); noStroke(); ellipse(f.x, f.y, f.size, f.size); fill("#FFD700"); ellipse(f.x, f.y, f.size * 0.6, f.size * 0.6); } }
    }
    function checkFireHit(x, y) {
      if (!fireGame.active) return;
      for (let f of fireGame.fires) {
        if (!f.hit && dist(x, y, f.x, f.y) < f.size / 2 + 20) {
          f.hit = true; fireGame.score++;
          if (fireGame.score >= 15) { fireGame.active = false; endFireGame(true); return; }
        }
      }
    }
    function endFireGame(win = false) {
      currentState = "ZONE"; overlay.style.display = "block"; backBtn.style.display = "block"; logBtn.style.display = "block";
      if (win) startDialogue([ { speaker: "消防员", text: "小伙子好样的，火灭了！" }, { speaker: "班主任", text: "虽然你救了火，但也耽误了晚自习，给我回教室去！" } ], () => { startNightStudyPhase3(); });
      else startDialogue([ { speaker: "消防员", text: "快退后，我们来处理！" }, { speaker: "班主任", text: "太危险了！赶紧回教室，我要好好罚你！" } ], () => { startNightStudyPhase3(); });
    }

    function resetGame() {
      currentState = "TITLE";
      
      shared.tasksCompleted = 0;
      shared.visitedZones = [];
      shared.activeTasks = [];
      shared.papers = 0;
      shared.hasEnded = false;
      shared.helpedList.clear();
      isHiddenEnding = false;
      
      currentMinutes = 7 * 60 + 30;
      currentWeather = WEATHERS[0];
      updateClockUI();
      
      shared.playerPos = { ...START_POS };
      shared.targetZone = null;
      
      updateTaskUI();
      overlay.style.display = "none";
      backBtn.style.display = "none";
      choicePanel.style.display = "none";
      
      if (audioSchool) { audioSchool.pause(); audioSchool.currentTime = 0; }
      if (audioHidden) { audioHidden.pause(); audioHidden.currentTime = 0; }
      playMusicBtn.style.display = "none";
    }

    function renderLog() {
      logContent.innerHTML = "";
      globalLog.forEach(item => {
        let highlightedText = item.text.replace(/【(.*?)】/g, '<span class="task-hl">【$1】</span>');
        logContent.innerHTML += `<p><span class="log-speaker">${item.speaker}:</span>${highlightedText}</p>`;
      });
      logContent.scrollTop = logContent.scrollHeight;
    }
  </script>
</body>
